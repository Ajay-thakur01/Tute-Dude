    <title>Forms</title>
</head>
<body>
    <h2>Forms in HTML</h2>
    <form action="links.html" >
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

        <label for="age">Age:</label>
        <input type="number" required><br><br>

        <label for="Date of birth">Date of birth:</label>
        <input type="date" required><br><br>

        <h3>Options:</h3>
        <input type="Radio" name="option" id="Option1" required><label  for="Option1">Option 1</label><br>
        <input type="Radio" name="option" id="Option2" required checked ><label  for="Option2" >Option 2 </lab2el><br>
        <input type="Radio" name="option" id="Option3" required><label  for="Option3">Option 3</label><br><br>

        <label for="color">Choose a color:</label>
        <input type="color" id="color" name="color" value="red"><br><br>

        <input type="submit" value="Submit"> 
</body>
