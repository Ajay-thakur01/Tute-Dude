<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <div class="div">
        <h1>Registration Form</h1>
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your name" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <br><br>
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
            <br><br>
           
            <h3>Personal Information</h3>
             <label for="Phone-No">Phone Number:</label>
            <input type="tel" id="Phone-No" name="Phone-No" placeholder="Enter your phone number" required> <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
            <label for="gender">Gender:</label> 
            <input type="radio" id="male" name="gender" value="male" required>
            <labvel for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
            <input type="radio" id="Other" name="gender" value="Other" required>
            <label for="Other">Other</label><br><br>
            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" placeholder="Enter your address" required><br><br>
            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city" required><br><br>
            <label for="state">State:</label>
            <input type="text" id="state" name="state" placeholder="Enter your state" required><br><br>
            <label for="Country">Country:</label>
            <input type="text" id="Country" name="Country" placeholder="Enter your country" required><br><br>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label><br><br>
            <label for="profile-picture">Profile Picture:</label>
            <input type="file" id="profile-picture" name="profile-picture" accept="image/*"><br><br>

            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </form>
    </div></h1>
</body>
</html>
