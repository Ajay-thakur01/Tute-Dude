<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- ul - unordered list (dots) -->
    <ul type="square">
        <!-- li - list item  -->
        <li>English</li>
        <li>Math</li>
        <li>Science</li>
    </ul>

    <!-- ol - ordered list (numbers) -->
    <ol reversed="true" type="A" >
         <!-- reversed="true" - reverse the order -->
         <!-- start="100" - set the starting number -->
          <!-- type="A" - set the list type -->
        <li>First Item</li>
        <ol>
            <li>Sub Item 1</li>
            <ul>
                <li>dsa</li>
                <li>dsa</li>

            </ul>
            <li>Sub Item 2</li>
            <li>Sub Item 3</li>
        </ol>
        <li>Second Item</li>
        <li>Third Item</li>
    </ol>

    <!-- dl - description list -->
    <dl>
        <!-- <dt> - description term -->
        <dt>Term 1</dt>
        <!-- <dd> - description description -->
        <dd>Description for Term 1</dd>
        <dt>Term 2</dt>
        <dd>Description for Term 2</dd>
    </dl>
</body>
</html>
