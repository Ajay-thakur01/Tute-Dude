<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="https://static.vecteezy.com/system/resources/previews/026/721/193/non_2x/washing-machine-and-laundry-laundry-sticker-png.png" alt="Laundry illustration">
        </div>
        <div class="right">
            <h2>Hello Again!</h2>
            <p class="first">Welcome back! we missed you!</p>
            
            <form action="#">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="abc@gmail.com">

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Password">

                <a href="#" class="pass">Forget Password</a>
                <button type="submit" class="log">Login</button>

                <p class="sec">Not a member?
                    <a href="#">Register Now</a></p>
            </form>
        </div>
    </div>
</body>
</html>
