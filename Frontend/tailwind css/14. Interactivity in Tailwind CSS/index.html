<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactivity with Tailwind CSS</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <button class="bg-blue-400 px-5 py-2 m-3 rounded-md text-white">Register - Simple Button</button>

    <button class="bg-blue-400 hover:bg-blue-600 hover:text-yellow-300 block px-5 py-2 m-3 rounded-md text-white">Register - Hover Button</button>

    <button class="bg-blue-400 focus:bg-yellow-500 block px-5 py-2 m-3 rounded-md text-white">Register - Focus Button</button>

    <button class="bg-green-400 active:bg-red-400 block px-5 py-2 m-3 rounded-md text-white">Register - actice button</button>

</body>
</html>
