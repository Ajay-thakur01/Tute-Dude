<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    ul{
        background-color: black;
        list-style: none;
        display: flex;
        gap: 40px;
        padding: 20px;
        overflow: hidden;
    }
    a{
        text-decoration: none;
        color: #fff;
        font-weight: 700;
        font-size: 1.2rem;
        padding-bottom: 5px;
        transition: all 0.3s;
    }
    a:hover{
        color: #f33838;
        border-bottom: solid #f33838;
    }
</style>
<body>
    <ul class="links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#"> About Us</a></li>
        <li><a href="#"> Contact Us</a></li>
    </ul>
</body>
</html>
