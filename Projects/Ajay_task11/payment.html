<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <section class="checkout">
        <div class="outer-container">

            <!-- left container -->
            <div class="left-box">
                <p class="check">
                    Checkout
                </p>
                <h3 class="details">
                    Contact Details
                </h3>
                <label for="email-id" class="email-id">
                    Email ID
                </label>
                <input type="email" class="email" for="email-id" placeholder="abc@gmail.com">

                <h3 class="pay">Payment</h3>
                <div class="bottom-box">
                    <div class="cards">
                        <div class="card1">Card</div>
                        <div class="card1">Crtpto</div>
                        <div class="card1">Bank</div>
                        <div class="dots">. . .</div>
                    </div>
                    <form action="" class="card-detail">
                        <label for="number" class="number">Card Number</label>
                        <input type="number" name="" id="number" >

                        <div class="box">
                            <div class="left">
                                
                                <label for="expiry" class="expiry">Expiry</label>
                                <input type="date" name="" id="expiry" >

                                <label for="country" class="country">Country</label>
                                <input type="text" name="" id="country" >

                            </div>

                            <div class="right">
                                
                                <label for="cvc" class="cvc">CVC</label>
                                <input type="text" name="" id="cvc" class="cvc">
                                
                                <label for="zip" class="zip">ZIP</label>
                                <input type="password" name="" id="zip" >

                            </div>
                        </div>

                    </form>
                </div>
            </div>

            <!-- right container -->
            <div class="right-box">
                <h3 class="heading">Order Summary</h3>
                <div class="bill-box">
                    <p class="cupon">Enter Coupon Code</p>
                    <input type="text" name="" id="" class="cupon-code" placeholder="Enter Coupon Code">
                    <a href="" class="apply-btn">Apply Coupon</a>
                    <div class="grid-box1">
                        <div class="left">
                            <p class="left-text">Sub Total</p>
                            <p class="left-text">Taxes(if applicable)</p>
                            <p class="left-text">Discount</p>
                            <p class="left-text bold">Total</p>
                            
                        </div>
                        <div class="right">
                            <p class="right-text">$4,700</p>
                            <p class="right-text">$199</p>
                            <p class="right-text">0</p>
                            <p class="right-text bold">$4,999</p>
                        </div>
                    </div>
                </div>
                <a href="" class="pay-btn">Pay Now</a>
                <div class="img-box">
                  <img src="" alt="" class="img img1">
                  <img src="" alt="" class="img img2">
                  <img src="" alt="" class="img img3">
                </div>
            </div>
        </div>
    </section>
</body>
</html>
